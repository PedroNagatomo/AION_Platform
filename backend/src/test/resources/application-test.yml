spring:
  application:
    name: universal-ai-backend

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: false  # Desabilitar migrations (H2 cria o schema)

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 0  # Porta aleatória para testes

# Configurações de teste (fake)
ai:
  provider: groq
  groq:
    api-key: test-key-for-ci
    base-url: https://api.groq.com/openai/v1
    model: test-model
    max-tokens: 1000
    temperature: 0.7

jwt:
  secret: test-secret-key-for-ci-that-is-at-least-256-bits-long-enough
  expiration: 86400000

voice:
  elevenlabs:
    api-key: test-key
    voice-id: test-voice
    model: test-model

logging:
  level:
    com.universalai: WARN
    org.springframework: WARN
    org.hibernate: WARN