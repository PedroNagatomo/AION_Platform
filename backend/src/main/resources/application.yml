spring:
  application:
    name: universal-ai-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://localhost:5432/universalai
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always

ai:
  provider: groq
  groq:
    api-key: ${GROQ_API_KEY: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}
    base-url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    max-tokens: 4096
    temperature: 0.7

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-that-is-very-secure-and-long}
  expiration: 31536000000

logging:
  level:
    com.universalai: DEBUG

download:
  path: ./downloads

voice:
